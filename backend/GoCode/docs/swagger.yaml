basePath: /api/
definitions:
  api_functions.CreateAppRequest:
    properties:
      application_name:
        type: string
      application_type:
        type: string
      link_to_website:
        type: string
    required:
    - application_name
    - application_type
    type: object
  api_functions.CreateGroupRequest:
    properties:
      group_name:
        type: string
      role:
        type: string
    required:
    - group_name
    - role
    type: object
  api_functions.CreateOSRequest:
    properties:
      link_to_os_website:
        type: string
      os_name:
        type: string
      os_version:
        type: string
    required:
    - link_to_os_website
    - os_name
    - os_version
    type: object
  api_functions.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  api_functions.CreateVMRequest:
    properties:
      application_ids:
        items:
          type: integer
        type: array
      description:
        type: string
      os_id:
        type: integer
      owner_id:
        type: integer
      vm_ip:
        type: string
      vm_name:
        type: string
      vm_status:
        enum:
        - running
        - stopped
        - maintenance
        type: string
    required:
    - os_id
    - owner_id
    - vm_ip
    - vm_name
    - vm_status
    type: object
  api_functions.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  api_functions.LoginResponse:
    properties:
      token:
        type: string
    type: object
  api_functions.ManageVMApplicationsRequest:
    type: object
  api_functions.ModifyGroupUsersRequest:
    properties:
      user_ids:
        items:
          type: integer
        type: array
    required:
    - user_ids
    type: object
  api_functions.MoveAppRequest:
    properties:
      target_vm_id:
        type: integer
    required:
    - target_vm_id
    type: object
  api_functions.UpdateAppRequest:
    properties:
      application_name:
        type: string
      application_type:
        type: string
      link_to_website:
        type: string
    type: object
  api_functions.UpdateGroupRequest:
    properties:
      group_name:
        type: string
      role:
        type: string
    type: object
  api_functions.UpdateOSRequest:
    properties:
      link_to_os_website:
        type: string
      os_name:
        type: string
      os_version:
        type: string
    type: object
  api_functions.UpdateVMRequest:
    properties:
      description:
        type: string
      vm_ip:
        type: string
      vm_name:
        type: string
      vm_status:
        enum:
        - running
        - stopped
        - maintenance
        type: string
    type: object
  tables.Application:
    properties:
      applicationID:
        type: integer
      applicationName:
        type: string
      applicationType:
        type: string
      createdAt:
        type: string
      linkToWebsite:
        type: string
      updatedAt:
        type: string
      vms:
        items:
          $ref: '#/definitions/tables.VM'
        type: array
    type: object
  tables.Group:
    properties:
      groupID:
        type: integer
      groupName:
        type: string
      role:
        type: string
      users:
        items:
          $ref: '#/definitions/tables.User'
        type: array
    type: object
  tables.OperatingSystem:
    properties:
      createdAt:
        type: string
      linkToOSWebsite:
        type: string
      osid:
        type: integer
      osname:
        type: string
      osversion:
        type: string
      updatedAt:
        type: string
    type: object
  tables.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      groups:
        items:
          $ref: '#/definitions/tables.Group'
        type: array
      role:
        type: string
      userID:
        type: integer
      username:
        type: string
    type: object
  tables.VM:
    properties:
      applications:
        items:
          $ref: '#/definitions/tables.Application'
        type: array
      createdAt:
        type: string
      description:
        type: string
      osid:
        type: integer
      owner:
        allOf:
        - $ref: '#/definitions/tables.Group'
        description: Relationships
      ownerID:
        type: integer
      vmid:
        type: integer
      vmip:
        type: string
      vmname:
        type: string
      vmstatus:
        type: string
    type: object
