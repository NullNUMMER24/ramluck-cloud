<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.2/dist/full.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">User Management</h1>
        <button class="btn btn-primary" onclick="showUserForm()">
            <i class="fas fa-plus mr-2"></i> Add User
        </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="table table-zebra">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="users-table">
                <!-- Users loaded dynamically -->
            </tbody>
        </table>
    </div>

    <!-- User Form Modal -->
    <dialog id="userModal" class="modal">
        <div class="modal-box w-11/12 max-w-2xl">
            <h3 class="font-bold text-lg" id="modalUserTitle"></h3>
            <div id="modalUserContent" class="py-4"></div>
            <div class="modal-action">
                <button class="btn" onclick="document.getElementById('userModal').close()">Close</button>
            </div>
        </div>
    </dialog>

    <script src="js/users.js"></script>
</body>
</html>
