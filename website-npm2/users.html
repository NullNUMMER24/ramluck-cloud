<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex">
        <!-- Include your sidebar here (same as dashboard.html) -->
        <aside class="bg-white w-64 shadow-lg fixed h-full">
          <div class="p-4">
              <!-- Logo -->
              <div class="flex items-center gap-2 mb-8">
                  <i class="fas fa-rocket text-blue-600 text-2xl"></i>
                  <span class="text-xl font-bold">RAMLUCK-CLOUD</span>
              </div>

              <!-- Navigation Menu -->
              <nav>
                  <ul class="space-y-2">
                      <li>
                          <a href="dashboard.html" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                              <i class="fas fa-home w-6"></i>
                              Dashboard
                          </a>
                      </li>
                      <li>
                          <a href="users.html" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                              <i class="fas fa-users -bar w-6"></i>
                              Users
                          </a>
                      </li>
                      <li>
                          <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                              <i class="fas fa-user-circle w-6"></i>
                              Groups
                          </a>
                      </li>
                      <li>
                          <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                              <i class="fas fa-server w-6"></i>
                              Virtual Machines
                          </a>
                      </li>
                      <li>
                        <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                            <i class="fas fa-cubes w-6"></i>
                            Applications
                        </a>
                      </li>
                      <li>
                        <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                            <i class="fas fa-television w-6"></i>
                            Operating Systems
                        </a>
                      </li>
                      <li>
                        <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                            <i class="fas fa-cog w-6"></i>
                            Hosts
                        </a>
                      </li>
                      <li>
                        <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                            <i class="fas fa-folder w-6"></i>
                            Projects
                        </a>
                      </li>
                      <li>
                        <a href="#" class="flex items-center gap-3 p-3 hover:bg-blue-50 rounded-lg text-gray-600 hover:text-blue-600 transition-all">
                            <i class="fas fa-shopping-cart w-6"></i>
                            Customer Portal
                        </a>
                      </li>
                  </ul>
              </nav>
          </div>
      </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">User Management</h1>
                <button onclick="openUserModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-plus mr-2"></i>New User
                </button>
            </div>

            <!-- User Table -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <table class="w-full" id="usersTable">
                    <thead>
                        <tr class="text-left text-gray-500 border-b">
                            <th class="pb-3">ID</th>
                            <th class="pb-3">Name</th>
                            <th class="pb-3">Email</th>
                            <th class="pb-3">Role</th>
                            <th class="pb-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Dynamic content will be inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- User Modal -->
            <div id="userModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                <div class="bg-white rounded-xl p-6 w-96">
                    <h2 class="text-xl font-bold mb-4" id="modalTitle">New User</h2>
                    <form id="userForm" onsubmit="handleUserSubmit(event)">
                        <input type="hidden" id="userId">
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Name</label>
                            <input type="text" id="name" required
                                   class="w-full p-2 border rounded-lg">
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" required
                                   class="w-full p-2 border rounded-lg">
                        </div>
                        <div class="mb-4" id="passwordField">
                          <label class="block text-gray-700 mb-2">Password</label>
                          <input type="password" id="password" required minlength="8"
                                 class="w-full p-2 border rounded-lg">
                        </div>                      
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">Role</label>
                            <select id="role" class="w-full p-2 border rounded-lg">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button type="button" onclick="closeUserModal()"
                                    class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                                Cancel
                            </button>
                            <button type="submit"
                                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:8088/api';
      const authToken = localStorage.getItem('authToken');
  
      async function loadUsers() {
          try {
              const response = await fetch(`${API_BASE}/users`, {
                  headers: {
                      'Authorization': `Bearer ${authToken}`
                  }
              });
              const users = await response.json();
              renderUsers(users);
          } catch (error) {
              console.error('Error loading users:', error);
          }
      }
  
      function renderUsers(users) {
          const tbody = document.getElementById('usersTableBody');
          tbody.innerHTML = users.map(user => `
              <tr class="border-b hover:bg-gray-50">
                  <td class="py-3">${user.UserID}</td>
                  <td>${user.Username}</td>
                  <td>${user.Email}</td>
                  <td>${user.Role}</td>
                  <td>
                      <button onclick="editUser('${user.UserID}')" class="text-blue-600 hover:text-blue-800 mr-2">
                          <i class="fas fa-edit"></i>
                      </button>
                      <button onclick="deleteUser('${user.UserID}')" class="text-red-600 hover:text-red-800">
                          <i class="fas fa-trash"></i>
                      </button>
                  </td>
              </tr>
          `).join('');
      }
  
      async function deleteUser(userId) {
          if (confirm('Are you sure you want to delete this user?')) {
              try {
                  await fetch(`${API_BASE}/users/${userId}`, {
                      method: 'DELETE',
                      headers: {
                          'Authorization': `Bearer ${authToken}`
                      }
                  });
                  loadUsers();
              } catch (error) {
                  console.error('Error deleting user:', error);
              }
          }
      }
  
      function editUser(userId) {
        fetch(`${API_BASE}/users/${userId}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        })
        .then(res => res.json())
        .then(user => {
            document.getElementById('userId').value = user.UserID;
            document.getElementById('name').value = user.Username;
            document.getElementById('email').value = user.Email;
            document.getElementById('role').value = user.Role;
            document.getElementById('modalTitle').textContent = 'Edit User';

            // Hide password during editing
            document.getElementById('password').parentElement.style.display = 'none';

            document.getElementById('userModal').classList.remove('hidden');
        })
        .catch(err => {
            console.error('Edit failed:', err);
            alert('Could not load user for editing.');
        });
      }

  
      async function handleUserSubmit(event) {
        event.preventDefault();

        const userId = document.getElementById('userId').value;
        const isEdit = Boolean(userId);
        const url = isEdit
            ? `${API_BASE}/users/${userId}`
            : `${API_BASE}/login/register`;

            const userData = {
              username: document.getElementById('name').value,
              email: document.getElementById('email').value,
              role: document.getElementById('role').value,
            };

            if (!isEdit) {
                const password = document.getElementById('password').value;
                if (!password || password.length < 8) {
                    alert('Password must be at least 8 characters long.');
                    return;
                }
                userData.password = password;
            }

        try {
            const response = await fetch(url, {
                method: isEdit ? 'PUT' : 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify(userData)
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(err || 'Failed to save user');
            }

            closeUserModal();
            loadUsers();
        } catch (error) {
            console.error('Error saving user:', error);
            alert('Could not save user: ' + error.message);
        }
      }

  
      function openUserModal() {
        document.getElementById('userModal').classList.remove('hidden');
        document.getElementById('userId').value = '';
        document.getElementById('userForm').reset();
        document.getElementById('modalTitle').textContent = 'New User';

        document.getElementById('password').parentElement.style.display = 'block';
      }
  
      function closeUserModal() {
          document.getElementById('userModal').classList.add('hidden');
      }
  
      loadUsers();
  </script>  
</body>
</html>
