  <div class="main-content">
    <div class="page-header">
      <h1 class="page-title">Applications</h1>
      <p class="page-description">Manage Kubernetes and container applications</p>
    </div>

    <div id="alert-container"></div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">All Applications</h2>
        <button class="btn btn-primary" onclick="showCreateModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Add Application
        </button>
      </div>
      <div class="table-container" id="apps-table">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Application Modal -->
  <div class="modal" id="app-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Add Application</h2>
      </div>
      <form id="app-form">
        <div class="form-group">
          <label class="form-label">Application Name *</label>
          <input type="text" class="form-input" id="app-name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Application Type *</label>
          <select class="form-select" id="app-type" required>
            <option value="kubernetes">Kubernetes</option>
            <option value="docker">Docker</option>
            <option value="nixos">NixOS Service</option>
            <option value="systemd">Systemd Service</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Website / Repository URL</label>
          <input type="url" class="form-input" id="app-website" placeholder="https://...">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Application</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    if (!token) {
      window.location.href = 'index.html';
    }

    const API_BASE = 'http://localhost:8088/api';
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };

    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = 'index.html';
    }

    function showAlert(message, type = 'success') {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      document.getElementById('alert-container').appendChild(alertDiv);
      setTimeout(() => alertDiv.remove(), 5000);
    }

    async function loadApplications() {
      try {
        const response = await fetch(`${API_BASE}/applications`, { 
          method: 'GET',
          headers 
        });
        
        if (!response.ok) {
          // If endpoint doesn't exist yet, show placeholder
          if (response.status === 404) {
            displayApplications([]);
            return;
          }
          throw new Error('Failed to load applications');
        }
        
        const apps = await response.json();
        displayApplications(apps);
      } catch (error) {
        console.error('Error loading applications:', error);
        displayApplications([]);
      }
    }

    function displayApplications(apps) {
      const container = document.getElementById('apps-table');
      
      if (!apps || apps.length === 0) {
        container.innerHTML = '<p style="text-align: center; padding: 40px; color: var(--text-secondary);">No applications found. Add your first application to get started!</p>';
        return;
      }

      const table = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Website</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${apps.map(app => `
              <tr>
                <td><strong>${app.ApplicationName}</strong></td>
                <td><span class="badge badge-info">${app.ApplicationType}</span></td>
                <td>${app.LinkToWebsite ? `<a href="${app.LinkToWebsite}" target="_blank">Visit</a>` : '-'}</td>
                <td>${new Date(app.CreatedAt).toLocaleDateString()}</td>
                <td>
                  <button class="btn btn-sm btn-danger" onclick="deleteApplication(${app.ApplicationID}, '${app.ApplicationName}')">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      
      container.innerHTML = table;
    }

    function showCreateModal() {
      document.getElementById('app-form').reset();
      document.getElementById('app-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('app-modal').classList.remove('active');
    }

    document.getElementById('app-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const appData = {
        application_name: document.getElementById('app-name').value,
        application_type: document.getElementById('app-type').value,
        link_to_website: document.getElementById('app-website').value
      };

      try {
        const response = await fetch(`${API_BASE}/applications`, {
          method: 'POST',
          headers,
          body: JSON.stringify(appData)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create application');
        }

        showAlert('Application added successfully!');
        closeModal();
        loadApplications();
      } catch (error) {
        console.error('Error creating application:', error);
        showAlert(error.message, 'error');
      }
    });

    async function deleteApplication(id, name) {
      if (!confirm(`Are you sure you want to delete application "${name}"?`)) return;

      try {
        const response = await fetch(`${API_BASE}/applications/${id}`, {
          method: 'DELETE',
          headers
        });

        if (!response.ok) throw new Error('Failed to delete application');

        showAlert('Application deleted successfully!');
        loadApplications();
      } catch (error) {
        console.error('Error deleting application:', error);
        showAlert(error.message, 'error');
      }
    }

    // Close modal when clicking outside
    document.getElementById('app-modal').addEventListener('click', (e) => {
      if (e.target.id === 'app-modal') closeModal();
    });

    loadApplications();
  </script>
</body>
