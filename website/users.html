    <button class="logout-btn" onclick="logout()">Logout</button>

  <div class="main-content">
    <div class="page-header">
      <h1 class="page-title">Users</h1>
      <p class="page-description">Manage system users and access</p>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">All Users</h2>
      </div>
      <div class="table-container" id="user-table">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    if (!token) {
      window.location.href = 'index.html';
    }

    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = 'index.html';
    }

    fetch('http://localhost:8088/api/users', {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    })
    .then(response => {
      if (!response.ok) {
        throw new Error("Failed to fetch users.");
      }
      return response.json();
    })
    .then(users => {
      const table = `
        <table>
          <thead>
            <tr>
              <th>UserID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(user => `
              <tr>
                <td>${user.UserID}</td>
                <td><strong>${user.Username}</strong></td>
                <td>${user.Email}</td>
                <td><span class="badge badge-${user.Role === 'admin' ? 'danger' : 'info'}">${user.Role}</span></td>
                <td>${new Date(user.CreatedAt).toLocaleString()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('user-table').innerHTML = table;
    })
    .catch(error => {
      console.error(error);
      document.getElementById('user-table').innerHTML = '<p class="alert alert-error">Error loading users.</p>';
    });
  </script>
