  <div class="main-content">
    <div class="page-header">
      <h1 class="page-title">Virtual Machines</h1>
      <p class="page-description">Manage your NixOS and other virtual machines</p>
    </div>

    <div id="alert-container"></div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">All Virtual Machines</h2>
        <button class="btn btn-primary" onclick="showCreateModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Deploy VM
        </button>
      </div>
      <div class="table-container" id="vms-table">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit VM Modal -->
  <div class="modal" id="vm-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Deploy Virtual Machine</h2>
      </div>
      <form id="vm-form">
        <div class="form-group">
          <label class="form-label">VM Name *</label>
          <input type="text" class="form-input" id="vm-name" required>
        </div>
        <div class="form-group">
          <label class="form-label">IP Address *</label>
          <input type="text" class="form-input" id="vm-ip" placeholder="192.168.1.10" required>
        </div>
        <div class="form-group">
          <label class="form-label">Status *</label>
          <select class="form-select" id="vm-status" required>
            <option value="running">Running</option>
            <option value="stopped">Stopped</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Owner Group *</label>
          <select class="form-select" id="vm-owner" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Operating System *</label>
          <select class="form-select" id="vm-os" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="vm-description" placeholder="Optional description"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Deploy VM</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    if (!token) {
      window.location.href = 'index.html';
    }

    const API_BASE = 'http://localhost:8088/api';
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };

    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = 'index.html';
    }

    function showAlert(message, type = 'success') {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      document.getElementById('alert-container').appendChild(alertDiv);
      setTimeout(() => alertDiv.remove(), 5000);
    }

    async function loadVMs() {
      try {
        const response = await fetch(`${API_BASE}/vms`, { headers });
        if (!response.ok) throw new Error('Failed to load VMs');
        
        const vms = await response.json();
        displayVMs(vms);
      } catch (error) {
        console.error('Error loading VMs:', error);
        document.getElementById('vms-table').innerHTML = '<p class="alert alert-error">Error loading VMs</p>';
      }
    }

    function displayVMs(vms) {
      const container = document.getElementById('vms-table');
      
      if (!vms || vms.length === 0) {
        container.innerHTML = '<p style="text-align: center; padding: 40px; color: var(--text-secondary);">No VMs found. Deploy your first VM to get started!</p>';
        return;
      }

      const table = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>IP Address</th>
              <th>Status</th>
              <th>Owner Group</th>
              <th>Description</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${vms.map(vm => `
              <tr>
                <td><strong>${vm.VMName}</strong></td>
                <td>${vm.VMIP}</td>
                <td><span class="badge badge-${vm.VMStatus === 'running' ? 'success' : vm.VMStatus === 'stopped' ? 'danger' : 'warning'}">${vm.VMStatus}</span></td>
                <td>${vm.Owner ? vm.Owner.GroupName : 'N/A'}</td>
                <td>${vm.Description || '-'}</td>
                <td>${new Date(vm.CreatedAt).toLocaleDateString()}</td>
                <td>
                  <button class="btn btn-sm btn-danger" onclick="deleteVM(${vm.VMID}, '${vm.VMName}')">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      
      container.innerHTML = table;
    }

    async function loadGroups() {
      try {
        const response = await fetch(`${API_BASE}/groups`, { headers });
        if (!response.ok) throw new Error('Failed to load groups');
        
        const groups = await response.json();
        const select = document.getElementById('vm-owner');
        select.innerHTML = '<option value="">Select a group</option>' +
          groups.map(g => `<option value="${g.GroupID}">${g.GroupName}</option>`).join('');
      } catch (error) {
        console.error('Error loading groups:', error);
      }
    }

    async function loadOS() {
      try {
        const response = await fetch(`${API_BASE}/os`, { headers });
        if (!response.ok) throw new Error('Failed to load OS');
        
        const osList = await response.json();
        const select = document.getElementById('vm-os');
        select.innerHTML = '<option value="">Select an OS</option>' +
          osList.map(os => `<option value="${os.OSID}">${os.OSName} ${os.OSVersion}</option>`).join('');
      } catch (error) {
        console.error('Error loading OS:', error);
      }
    }

    function showCreateModal() {
      document.getElementById('modal-title').textContent = 'Deploy Virtual Machine';
      document.getElementById('vm-form').reset();
      document.getElementById('vm-modal').classList.add('active');
      loadGroups();
      loadOS();
    }

    function closeModal() {
      document.getElementById('vm-modal').classList.remove('active');
    }

    document.getElementById('vm-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const vmData = {
        vm_name: document.getElementById('vm-name').value,
        vm_ip: document.getElementById('vm-ip').value,
        vm_status: document.getElementById('vm-status').value,
        owner_id: parseInt(document.getElementById('vm-owner').value),
        os_id: parseInt(document.getElementById('vm-os').value),
        description: document.getElementById('vm-description').value
      };

      try {
        const response = await fetch(`${API_BASE}/vms`, {
          method: 'POST',
          headers,
          body: JSON.stringify(vmData)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create VM');
        }

        showAlert('VM deployed successfully!');
        closeModal();
        loadVMs();
      } catch (error) {
        console.error('Error creating VM:', error);
        showAlert(error.message, 'error');
      }
    });

    async function deleteVM(id, name) {
      if (!confirm(`Are you sure you want to delete VM "${name}"?`)) return;

      try {
        const response = await fetch(`${API_BASE}/vms/${id}`, {
          method: 'DELETE',
          headers
        });

        if (!response.ok) throw new Error('Failed to delete VM');

        showAlert('VM deleted successfully!');
        loadVMs();
      } catch (error) {
        console.error('Error deleting VM:', error);
        showAlert(error.message, 'error');
      }
    }

    // Close modal when clicking outside
    document.getElementById('vm-modal').addEventListener('click', (e) => {
      if (e.target.id === 'vm-modal') closeModal();
    });

    loadVMs();
  </script>
</body>
