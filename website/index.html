<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAMLUCK-CLOUD Login & Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>RAMLUCK-CLOUD</h1>
  </header>
  <div class="container">
    <div class="card" id="card">
      <div class="card-front">
        <h2>Login</h2>
        <form id="login-form">
          <input type="text" id="login-username" name="username" placeholder="Username" required>
          <input type="password" id="login-password" name="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="to-register">Register</a></p>
      </div>
      <div class="card-back">
        <h2>Register</h2>
        <form id="register-form">
          <input type="text" id="register-username" name="username" placeholder="Username" required>
          <input type="email" id="register-email" name="email" placeholder="Email" required>
          <input type="password" id="register-password" name="password" placeholder="Password" required>
          <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="#" id="to-login">Login</a></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
